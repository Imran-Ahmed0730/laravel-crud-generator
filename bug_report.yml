name: Bug Report
description: Report a problem with the CRUD generator
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: input
    id: package-version
    attributes:
      label: Package Version
      placeholder: "e.g. v1.2.0"
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel Version
      placeholder: "e.g. 11.x"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP Version
      placeholder: "e.g. 8.2"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Artisan Command Used
      description: The exact command you ran
      placeholder: "php artisan make:crud Post --fields=title:string,body:text"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: "What should have happened?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      placeholder: "What actually happened? Include any error messages or stack traces."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other information that might be relevant (e.g. custom config, published stubs)
